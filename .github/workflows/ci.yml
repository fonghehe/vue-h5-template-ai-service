name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vh5_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vh5_ai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:local-ci-only@localhost:5432/vh5_ai_test
      DATABASE_AUTO_CREATE: "false"
      AI_TEST_DATABASE_URL: postgresql+asyncpg://postgres:local-ci-only@localhost:5432/vh5_ai_test
      AI_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      - name: Migration round trip and metadata check
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Audit production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/ai-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/ai-requirements.txt

      - name: Build package
        run: uv build

      - name: Build image
        run: docker build -t vue-h5-template-ai-service:test .
