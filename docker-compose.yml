services:
  ai:
    build: .
    environment:
      APP_ENV: development
      AI_PROVIDER: mock
      AI_AUTH_REQUIRED: "true"
      JWT_SECRET: local-compose-secret-change-in-production
      JWT_ISSUER: vue-h5-template
      JWT_AUDIENCE: vue-h5-template-api
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vue_h5_ai
      DATABASE_AUTO_CREATE: "false"
      BUSINESS_SERVICE_URL: http://host.docker.internal:8002
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vue_h5_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vue_h5_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai-postgres-data:
