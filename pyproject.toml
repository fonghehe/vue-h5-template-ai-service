[project]
name = "vue-h5-template-ai-service"
version = "1.0.0"
description = "Provider-neutral streaming AI service for vue-h5-template"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "fonghehe" }]
keywords = ["fastapi", "sse", "streaming", "ai", "vue-h5-template"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "pyjwt>=2.10.1,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10.1,<3",
  "redis>=6.4.0,<7",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
  # starlette 1.x deprecates the httpx-based TestClient in favor of the
  # not-yet-vetted httpx2 package. Plain httpx stays fully supported as a
  # fallback, so we keep httpx and ignore only this one warning.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
